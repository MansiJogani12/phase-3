version: "3.9"

services:
  backend:
    build: ./fastapi-server
    ports:
      - "3000:3000"
    env_file:
      - ./fastapi-server/.env
    depends_on:
      - mongo
      - redis

  mongo:
    image: mongo:6
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7

  llm-server:
    build: ./llm-server
    ports:
      - "5001:5001"
    environment:
      - PORT=5001

volumes:
  mongo_data:
